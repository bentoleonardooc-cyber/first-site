<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .cartao {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="cartao">
        <h1>Olá, eu sou o Dev!</h1>
        <p>Estou aprendendo a criar sites com HTML, CSS e JavaScript.</p>
        <button id="botaoClique">Clique aqui</button>
        <p id="mensagem" style="margin-top: 15px; color: #28a745; font-weight: bold;"></p>
    </div>

    <script>
        const botao = document.getElementById('botaoClique');
        const mensagem = document.getElementById('mensagem');

        botao.addEventListener('click', function() {
            mensagem.innerText = "🎉 Parabéns! Você acabou de rodar seu primeiro script!";
        });
    </script>
</body>
</html>
